name: nrv-demo
services:
  nrv-demo:
    image: nrv-demo:noetic
    build:
      context: .
      dockerfile: docker/Dockerfile
    platform: linux/amd64
    network_mode: host
    device_cgroup_rules:
      - 'c 189:* rwm'
    init: true
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: '1'
      ROS_MASTER_URI: ${ROS_MASTER_URI:-http://localhost:11311}
      ROS_HOSTNAME: ${ROS_HOSTNAME:-localhost}
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./output:/output
      - ./examples:/examples:ro
